services:
  - type: web
    name: collector-marketplace
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collector-db
          property: connectionString
      - key: SHIPPO_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_ENV
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://collectormarketplace.net
