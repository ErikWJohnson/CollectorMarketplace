<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>Collector Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="layout-fixes.css"><link rel="stylesheet" href="full-width.css"><link rel="stylesheet" href="immersive-feed.css"><link rel="stylesheet" href="persistent-dock.css"><link rel="stylesheet" href="marketplace-policy.css"><link rel="stylesheet" href="post-fill.css"><link rel="stylesheet" href="full-image.css"><link rel="stylesheet" href="header-optimized.css"><link rel="stylesheet" href="auction-house.css"><link rel="stylesheet" href="scrolling-header.css"><link rel="stylesheet" href="scrolling-discovery.css"><link rel="stylesheet" href="site-functionality.css"><link rel="stylesheet" href="header-corner-fix.css"><link rel="stylesheet" href="functional-discovery.css"><link rel="stylesheet" href="logo-raster.css">
</head>
<body>
  <div class="app-shell">
    <header class="masthead"><div class="brand-group"><img src="public/logo-three-cards.png" alt="Collector Marketplace logo"><div class="mast-word"><small>Collector’s</small><strong>Marketplace</strong></div></div><nav class="header-nav" aria-label="Website navigation"><button type="button" data-home>Browse</button><button type="button" data-auction>Auction House</button><button type="button" data-policy>Fees</button></nav><button type="button" class="header-sell" data-sell>List item</button></header>
    <section class="mode-tabs" role="tablist" aria-label="Browse controls"><button type="button" id="search-tab" class="is-active" role="tab" aria-selected="true" aria-controls="search">SEARCH</button><button type="button" id="tags-tab" role="tab" aria-selected="false" aria-controls="tags">TAGS</button></section>
    <section class="discovery mode-search">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search collector finds"><button class="clear" id="clear-tags" hidden>×</button></label>
      <div class="tag-row" id="tags"><button type="button" data-query="NASA" aria-pressed="false">#SPACE</button><button type="button" data-query="Mickey" aria-pressed="false">#CARDS</button><button type="button" data-query="Comic" aria-pressed="false">#COMICS</button><button type="button" data-query="Polaroid" aria-pressed="false">#VINTAGE</button><button type="button" data-query="Design" aria-pressed="false">#BOOKS</button></div>
      <div class="category-row" id="categories"></div>
    </section>
    <div class="market-head"><span>FRESH DROPS</span><span id="result-count"></span></div>
    <main class="market-stage">
      <aside class="ad ad-left">ADS</aside><section id="listing-stream" class="listing-stream" aria-label="Marketplace listings"></section><aside class="ad ad-right">ADS</aside>
    </main>
    <div id="sentinel" class="load-state">SCROLL FOR MORE FINDS ↓</div>
    <nav class="bottom-nav" aria-label="Marketplace navigation"><button class="active" data-home><b>◇</b>Browse</button><button data-auction><b>⌂</b>Auction</button><button data-chat><b>▣</b>Chat</button><button data-sell><b>$</b>Sell</button><button data-account><b>◉</b>Account</button></nav>
  </div>
  <dialog id="modal"><button class="close" aria-label="Close">×</button><div id="modal-content"></div></dialog>
  <script src="site.js"></script>
</body>
</html>
