<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Background -->
  <rect x="2" y="2" width="92" height="92" rx="28" fill="#050505"/>

  <!-- Cards -->
  <g stroke="#F1EFE7" stroke-width="4.5" stroke-linejoin="round" fill="none">
    <!-- Back card -->
    <rect x="18" y="32" width="34" height="46" rx="6" transform="rotate(-6 18 32)"/>

    <!-- Middle card (shifted right/up to avoid stroke collision) -->
    <rect x="34" y="24" width="34" height="46" rx="6" transform="rotate(10 34 24)"/>

    <!-- Front card (shifted further right/up to avoid collision) -->
    <rect x="50" y="18" width="34" height="46" rx="6" transform="rotate(20 50 18)"/>
  </g>
</svg>
