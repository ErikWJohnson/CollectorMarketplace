<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Background -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="#050505"/>

  <!-- Cards (guessed to match PNG proportions) -->
  <g stroke="#F1EFE7" stroke-width="4.5" stroke-linejoin="round" fill="none">
    <!-- Back card -->
    <rect x="20" y="34" width="38" height="50" rx="6" transform="rotate(-8 20 34)"/>

    <!-- Middle card -->
    <rect x="32" y="26" width="38" height="50" rx="6" transform="rotate(10 32 26)"/>

    <!-- Front card -->
    <rect x="46" y="20" width="38" height="50" rx="6" transform="rotate(20 46 20)"/>
  </g>
</svg>
